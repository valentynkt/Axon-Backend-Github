# Decision Log for {{story_id}}: {{story_title}}
# Generated by Axon Quality Guardian
# Date: {{date}}

story:
  id: "{{story_id}}"
  title: "{{story_title}}"
  module: "{{module}}"
  story_type: "{{story_type}}"

decisions:
  - id: "D001"
    timestamp: "{{timestamp}}"
    phase: "Understanding | Pre-Flight | Implementation | Validation"
    agent: "axon-story-orchestrator | axon-doc-oracle | axon-archaeologist | axon-library-sage | axon-implementation-surgeon | axon-quality-guardian"
    category: "Architecture | Pattern | Library | Implementation | Testing | Documentation"

    decision: "Short decision statement"

    rationale: |
      Detailed explanation of why this decision was made.
      Reference to documentation, ADRs, or existing patterns.

    alternatives_considered:
      - option: "Alternative 1"
        reason_rejected: "Why this wasn't chosen"
      - option: "Alternative 2"
        reason_rejected: "Why this wasn't chosen"

    impact:
      scope: "Small | Medium | Large"
      affected_files: []
      breaking_changes: false
      migration_required: false

    references:
      documentation: []
      adrs: []
      similar_code: []

    traceability:
      story_id: "{{story_id}}"
      acceptance_criteria: ["AC1", "AC2"]
      tech_spec_section: "{{tech_spec_section}}"

    confidence: "High | Medium | Low"
    review_status: "Approved | Pending | Rejected"

learning:
  what_worked_well:
    - "Pattern X was easy to apply"
    - "Library Y solved problem out-of-box"

  challenges:
    - "Challenge description"
      solution: "How it was overcome"

  future_improvements:
    - "Recommendation for next time"

  patterns_reinforced:
    - "Result<T> pattern worked well for error handling"
    - "StrongId<T> prevented ID mixups"

  documentation_gaps:
    - gap: "Missing example in docs"
      impact: "Slowed implementation"
      suggestion: "Add example to guide X"

metrics:
  total_decisions: 0
  by_category:
    architecture: 0
    pattern: 0
    library: 0
    implementation: 0
    testing: 0
    documentation: 0

  by_agent:
    story_orchestrator: 0
    doc_oracle: 0
    archaeologist: 0
    library_sage: 0
    implementation_surgeon: 0
    quality_guardian: 0

  confidence_distribution:
    high: 0
    medium: 0
    low: 0

summary:
  key_decisions: "1-2 sentence summary of most important decisions"
  overall_approach: "Brief description of implementation approach"
  reuse_score: "{{reuse_percentage}}%"
  pattern_compliance: "{{compliance_percentage}}%"