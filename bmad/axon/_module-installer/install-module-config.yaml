# Axon Module Installation Configuration
# Generated by BMad Builder
# Version: 1.0
# Date: 2025-09-30

# ═══════════════════════════════════════════════════════════
#                MODULE METADATA
# ═══════════════════════════════════════════════════════════

module_name: Axon Development Orchestrator
module_code: axon
installation_date: 2025-09-30
version: 1.0.0
installer_version: 1.0

# ═══════════════════════════════════════════════════════════
#                INSTALLATION STEPS
# ═══════════════════════════════════════════════════════════

install_steps:
  - name: 'Verify BMAD Core'
    action: 'check'
    target: '{project-root}/bmad/core/'
    description: 'Ensure BMAD Core v6 is installed'
    required: true

  - name: 'Verify Documentation'
    action: 'check'
    paths:
      - '{project-root}/Docs/ENGINEERING/00-START-HERE.md'
      - '{project-root}/Docs/ENGINEERING/guides/patterns/00-QUICK-REFERENCE.md'
      - '{project-root}/Docs/Libraries/00-INDEX.md'
    description: 'Verify core documentation exists'
    required: true

  - name: 'Create Axon directories'
    action: 'mkdir'
    paths:
      - '{project-root}/bmad/axon'
      - '{project-root}/bmad/axon/agents'
      - '{project-root}/bmad/axon/workflows'
      - '{project-root}/bmad/axon/templates'
      - '{project-root}/bmad/axon/data'
    description: 'Create module directory structure'

  - name: 'Copy configuration'
    action: 'copy'
    source: '{installer_path}/config.yaml'
    dest: '{project-root}/bmad/axon/config.yaml'
    description: 'Install module configuration'

  - name: 'Copy README'
    action: 'copy'
    source: '{installer_path}/README.md'
    dest: '{project-root}/bmad/axon/README.md'
    description: 'Install module documentation'

  - name: 'Register module'
    action: 'register'
    manifest: '{project-root}/bmad/_cfg/manifest.yaml'
    entry:
      module_code: axon
      module_name: 'Axon Development Orchestrator'
      module_type: implementation
      status: active
      agents_count: 6
      workflows_count: 9
    description: 'Register Axon in BMAD manifest'

  - name: 'Create active-stories directory'
    action: 'mkdir'
    paths:
      - '{project-root}/Docs/PROCESS/active-stories'
      - '{project-root}/Docs/PROCESS/active-stories/decisions'
    description: 'Create story output directories'

# ═══════════════════════════════════════════════════════════
#                DEPENDENCIES
# ═══════════════════════════════════════════════════════════

dependencies:
  required_modules:
    - module_code: bmm
      module_name: 'BMAD Method Module'
      version: '>=1.0'
      reason: 'Optional integration for planning workflows'
      required: false

  required_bmad_version: '6.0.0'

  external_dependencies:
    - name: 'Axon Backend Codebase'
      type: codebase
      paths:
        - '{project-root}/src'
        - '{project-root}/tests'
        - '{project-root}/Docs'
      required: true

    - name: 'Documentation Structure'
      type: documentation
      paths:
        - '{project-root}/Docs/ENGINEERING'
        - '{project-root}/Docs/Libraries'
        - '{project-root}/Docs/PROCESS'
      required: true

# ═══════════════════════════════════════════════════════════
#                POST-INSTALL ACTIONS
# ═══════════════════════════════════════════════════════════

post_install:
  - action: 'validate'
    description: 'Validate all documentation paths in config.yaml'

  - action: 'message'
    content: |
      ✅ Axon Module installed successfully!

      📁 Module Location: bmad/axon/
      📋 Configuration: bmad/axon/config.yaml
      📖 Documentation: bmad/axon/README.md

      🚀 Next Steps:

      1. Review the README: bmad/axon/README.md
      2. Load Story Orchestrator agent: bmad/axon/agents/axon-story-orchestrator.md
      3. Create your first story using: bmad/axon/templates/story-template.md

      📚 Design Document: Docs/PROCESS/bmad/axon-module-design-complete.md

      🎯 Quick Start:
      - Load @axon-story-orchestrator
      - Provide story.md
      - Follow 4 strategic checkpoints
      - Receive: Code + Tests + Docs + Decisions

      Happy developing! 🦸‍♂️

# ═══════════════════════════════════════════════════════════
#                UNINSTALL CONFIGURATION
# ═══════════════════════════════════════════════════════════

uninstall:
  confirmation_required: true
  backup_before_uninstall: true

  remove_paths:
    - '{project-root}/bmad/axon'

  preserve_paths:
    - '{project-root}/Docs/PROCESS/active-stories'  # Keep story history
    - '{project-root}/Docs/PROCESS/bmad/axon-module-design-complete.md'  # Keep design doc

  cleanup_actions:
    - action: 'unregister'
      manifest: '{project-root}/bmad/_cfg/manifest.yaml'
      module_code: axon

# ═══════════════════════════════════════════════════════════
#                UPGRADE CONFIGURATION
# ═══════════════════════════════════════════════════════════

upgrade:
  backup_config: true
  preserve_custom_agents: true
  preserve_custom_workflows: true
  merge_config_changes: true

# ═══════════════════════════════════════════════════════════
#                METADATA
# ═══════════════════════════════════════════════════════════

metadata:
  installer_author: Valik
  bmad_builder_version: 6.0.0
  last_updated: 2025-09-30
  installation_time_estimate: '5-10 minutes'