#                    TESTING PATTERNS
# ═══════════════════════════════════════════════════════════

testing_patterns:
  unit_test_pattern:
    name: "Unit Test Pattern"
    category: testing
    purpose: "Test single units of logic in isolation"
    library: NUnit + Shouldly + NSubstitute
    when_to_use:
      - "Domain logic testing"
      - "Handler testing"
      - "Validation testing"

    template: |
      [TestFixture]
      public sealed class AxonPrincipalTests
      {
          [Test]
          public void LinkWallet_WhenMaxWalletsReached_ShouldReturnError()
          {
              // Arrange
              var principal = AxonPrincipal.CreateHuman();
              for (int i = 0; i < 10; i++)
                  principal.LinkWallet(CreateOwnership());

              // Act
              var result = principal.LinkWallet(CreateOwnership());

              // Assert
              result.IsFailure.ShouldBeTrue();
              result.Error.Code.ShouldBe("WALLET.MAX_LIMIT");
          }
      }

    naming_convention: "MethodName_Scenario_ExpectedResult"

    assertion_style: |
      // Shouldly fluent assertions
      result.IsSuccess.ShouldBeTrue();
      result.Value.ShouldBe(expected);
      user.Email.ShouldBe("test@example.com");
      list.ShouldContain(item);

    related_patterns: [integration_test_pattern]

  integration_test_pattern:
    name: "Integration Test Pattern"
    category: testing
    purpose: "Test full stack with real database"
    library: NUnit + Testcontainers
    when_to_use:
      - "Repository testing"
      - "Database schema validation"
      - "End-to-end flows"

    template: |
      [TestFixture]
      public sealed class AxonPrincipalRepositoryTests : IntegrationTestBase
      {
          [Test]
          public async Task GetByWalletAsync_WhenExists_ShouldReturnPrincipal()
          {
              // Arrange
              var principal = await CreatePrincipalWithWallet("addr123");

              // Act
              var result = await _repo.GetByWalletAsync("addr123", default);

              // Assert
              result.ShouldNotBeNull();
              result.Id.ShouldBe(principal.Id);
          }
      }

    base_class: |
      public abstract class IntegrationTestBase : IDisposable
      {
          protected PostgreSqlContainer _postgres;
          protected DbContext _context;

          [OneTimeSetUp]
          public async Task OneTimeSetUp()
          {
              _postgres = new PostgreSqlBuilder().Build();
              await _postgres.StartAsync();
          }

          [OneTimeTearDown]
          public async Task OneTimeTearDown()
          {
              await _postgres.DisposeAsync();
          }
      }

    related_patterns: [unit_test_pattern, repository_pattern]

