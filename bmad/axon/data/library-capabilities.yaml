    nuget_package: CSharpFunctionalExtensions
    documentation: "BuildingBlocks/Core/Result pattern"

    capabilities:
      result_creation:
        - "Result.Success<T, E>(value)"
        - "Result.Failure<T, E>(error)"

      result_operations:
        - "Bind() - Chain operations"
        - "Map() - Transform success value"
        - "Match() - Pattern matching"
        - "Tap() - Side effects"

      result_checking:
        - "IsSuccess / IsFailure"
        - "Value property"
        - "Error property"

    use_cases:
      - "Domain operation error handling"
      - "Command/query results"
      - "Validation results"

    when_to_use:
      - "All domain methods that can fail"
      - "All command/query handlers"
      - "Repository operations"

  stronglytypedid:
    name: StronglyTypedId
    version: "1.x"
