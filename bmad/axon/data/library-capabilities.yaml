    purpose: "Type-safe entity identifiers"
    nuget_package: StronglyTypedId
    documentation: "BuildingBlocks/Core/StrongId pattern"

    capabilities:
      id_generation:
        - "Template.Guid"
        - "Template.Int"
        - "Template.String"

      operations:
        - "New() - Create new ID"
        - "From(value) - From existing value"
        - "Value - Get underlying value"

    use_cases:
      - "Aggregate root IDs"
      - "Entity IDs"
      - "Preventing ID mix-ups"

    when_to_use:
      - "All aggregate root IDs"
      - "All entity IDs"

  vogen:
    name: Vogen
    version: "4.x"
    category: domain_modeling
    purpose: "Value objects with validation"
    nuget_package: Vogen
    documentation: "BuildingBlocks/Core/Value objects"

    capabilities:
      value_object_creation:
        - "ValueObject attribute"
        - "Validation on creation"
        - "Immutability"

      validation:
        - "Validate(value) method"
        - "Validation.Ok / Invalid"
        - "Custom error messages"

    use_cases:
      - "Email addresses"
      - "Money/currency"
      - "Domain-specific value types"

    when_to_use:
      - "Domain values with validation"
      - "Immutable value types"

# ═══════════════════════════════════════════════════════════
#                    LIBRARY DECISION MATRIX
# ═══════════════════════════════════════════════════════════

decision_matrix:
  command_or_query:
    library: MediatR
    pattern: "Command/Query pattern"
    when: "Any application-layer operation"

  http_endpoint:
    library: FastEndpoints
    pattern: "Endpoint pattern"
    when: "Exposing HTTP API"

  input_validation:
    library: FluentValidation
    pattern: "Validator pattern"
    when: "Validating requests or commands"

  domain_error:
    library: CSharpFunctionalExtensions
    pattern: "Result<T, Error>"
    when: "Domain operations that can fail"

  entity_id:
    library: StronglyTypedId
    pattern: "StrongId<T>"
    when: "Entity identifiers"

  value_object:
    library: Vogen
    pattern: "Value object"
    when: "Validated immutable values"

  unit_test:
    library: NUnit + Shouldly
    pattern: "Unit test"
    when: "Testing domain logic"

  integration_test:
    library: NUnit + Testcontainers
    pattern: "Integration test"
    when: "Testing with real database"

  external_api:
    library: HttpClient + Polly
    pattern: "Resilient HTTP client"
    when: "Calling external services"

  observability:
    library: OpenTelemetry
    pattern: "Distributed tracing"
    when: "Production monitoring"

