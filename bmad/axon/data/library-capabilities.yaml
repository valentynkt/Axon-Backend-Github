#                    OBSERVABILITY & RESILIENCE LIBRARIES
# ═══════════════════════════════════════════════════════════

infrastructure_libraries:
  opentelemetry:
    name: OpenTelemetry
    version: "1.x"
    category: observability
    purpose: "Distributed tracing, metrics, and logging"
    nuget_package: OpenTelemetry
    documentation: "Docs/Libraries/OpenTelemetry/IMPLEMENTATION_GUIDE.md"

    capabilities:
      tracing:
        - "ActivitySource for custom spans"
        - "Automatic instrumentation"
        - "Span attributes"
        - "Trace context propagation"

      metrics:
        - "Counter metrics"
        - "Histogram metrics"
        - "Gauge metrics"
        - "Custom dimensions"

      exporters:
        - "Console exporter"
        - "OTLP exporter"
        - "Prometheus exporter"

    use_cases:
      - "Request tracing"
      - "Performance monitoring"
      - "Error tracking"
      - "Distributed system observability"

    when_to_use:
      - "Production environments"
      - "Performance debugging"
      - "System health monitoring"

    integration_points:
      - "ASP.NET Core middleware"
      - "Entity Framework Core"
      - "HttpClient"

    code_example: |
      using var activity = _activitySource.StartActivity("ProcessCommand");
      activity?.SetTag("command.type", command.GetType().Name);
      activity?.SetTag("user.id", userId);

  polly:
    name: Polly
    version: "8.x"
    category: resilience
    purpose: "Resilience patterns (retry, circuit breaker, timeout)"
    nuget_package: Polly
    documentation: "Docs/Libraries/Polly/IMPLEMENTATION_GUIDE.md"

    capabilities:
      policies:
        - "Retry with exponential backoff"
        - "Circuit breaker"
        - "Timeout"
        - "Bulkhead isolation"
        - "Fallback"

      resilience_pipeline:
        - "Chained policies"
        - "Policy registry"
        - "Async support"

    use_cases:
      - "External API calls"
      - "Database retry logic"
      - "Service degradation"
      - "Fault tolerance"

    when_to_use:
      - "All external HTTP calls"
      - "Dynamic.xyz API calls"
      - "Helius RPC calls"
      - "OpenAI API calls"

    integration_points:
      - "HttpClient factory"
      - "External service clients"

    code_example: |
      var retryPolicy = Policy
          .Handle<HttpRequestException>()
          .WaitAndRetryAsync(3, retryAttempt =>
              TimeSpan.FromSeconds(Math.Pow(2, retryAttempt)));

      var result = await retryPolicy.ExecuteAsync(() =>
          _httpClient.GetAsync(url, ct));

