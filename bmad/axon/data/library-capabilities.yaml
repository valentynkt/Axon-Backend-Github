# Axon Library Capabilities Map
# Comprehensive mapping of library features, use cases, and integration patterns
# Version: 1.0
# Last Updated: 2025-09-30

# ═══════════════════════════════════════════════════════════
#                    CORE ARCHITECTURE LIBRARIES
# ═══════════════════════════════════════════════════════════

core_libraries:
  mediatr:
    name: MediatR
    version: "12.x"
    category: architecture
    purpose: "CQRS mediator pattern implementation"
    nuget_package: MediatR
    documentation: "Docs/Libraries/MediatR/IMPLEMENTATION_GUIDE.md"

    capabilities:
      request_response:
        - "IRequest<TResponse> interface"
        - "IRequestHandler<TRequest, TResponse>"
        - "Async pipeline behavior"
        - "Unit return type for void operations"

      notifications:
        - "INotification interface"
        - "INotificationHandler<TNotification>"
        - "Multiple handlers per notification"
        - "Domain events dispatch"

      pipeline_behaviors:
        - "Logging behavior"
        - "Validation behavior"
        - "Transaction behavior"
        - "Performance monitoring"

    use_cases:
      - "Command handlers (write operations)"
      - "Query handlers (read operations)"
      - "Domain event handlers"
      - "Cross-cutting concerns (validation, logging)"

    when_to_use:
      - "Every command/query in Application layer"
      - "Domain event propagation"
      - "Request pipeline processing"

    integration_points:
      - "FastEndpoints (ISender injection)"
      - "Domain layer (event dispatch)"
      - "FluentValidation (pipeline behavior)"

    code_example: |
      // Command
      public sealed record CreateUserCommand(string Email) : ICommand<User>;

      // Handler
      public sealed class CreateUserHandler
          : IRequestHandler<CreateUserCommand, Result<User, Error>>
      {
          public async Task<Result<User, Error>> Handle(
              CreateUserCommand cmd,
              CancellationToken ct)
          {
              // Business logic
          }
      }

  fastendpoints:
    name: FastEndpoints
    version: "5.x"
    category: api
    purpose: "Minimal API endpoints without controllers"
    nuget_package: FastEndpoints
    documentation: "Docs/Libraries/FastEndpoints/IMPLEMENTATION_GUIDE.md"

    capabilities:
      endpoint_definition:
        - "Endpoint<TRequest, TResponse> base class"
        - "Configure() for routing/auth"
        - "HandleAsync() for logic"
        - "Built-in model binding"

      validation:
        - "Validator<TRequest> integration"
        - "FluentValidation support"
        - "Automatic validation execution"
        - "Error response formatting"

      authentication:
        - "JWT Bearer support"
        - "AllowAnonymous()"
        - "Policies()"
        - "Claims access"

      response_handling:
        - "SendOkAsync()"
        - "SendResultAsync()"
        - "SendErrorsAsync()"
        - "Custom status codes"

    use_cases:
      - "HTTP REST endpoints"
      - "Request/response handling"
      - "Authentication/authorization"
      - "API versioning"

    when_to_use:
      - "All HTTP endpoints (replaces controllers)"
      - "OpenAPI/Swagger generation"
      - "Request validation"

    integration_points:
      - "MediatR (ISender for commands/queries)"
      - "FluentValidation (request validation)"
      - "JWT Bearer auth"

    code_example: |
      public sealed class GetUserEndpoint
          : Endpoint<GetUserRequest, UserResponse>
      {
          public override void Configure()
          {
              Get("/api/v1/users/{id}");
              Policies("UserPolicy");
          }

          public override async Task HandleAsync(
              GetUserRequest req,
              CancellationToken ct)
          {
              var query = new GetUserQuery(req.Id);
              var result = await _sender.Send(query, ct);

              await result.Match(
                  onSuccess: user => SendOkAsync(user, ct),
                  onFailure: error => SendResultAsync(Results.Problem(error.ToProblem())));
          }
      }

  fluentvalidation:
    name: FluentValidation
    version: "11.x"
    category: validation
    purpose: "Fluent API for request/command validation"
    nuget_package: FluentValidation
    documentation: "Docs/Libraries/FluentValidation/IMPLEMENTATION_GUIDE.md"

    capabilities:
      rule_builders:
        - "NotEmpty() / NotNull()"
        - "EmailAddress()"
        - "Length(min, max)"
        - "Must(predicate) - custom validation"
        - "GreaterThan() / LessThan()"
        - "Matches(regex)"
        - "IsInEnum()"

      advanced_features:
        - "Conditional validation (When/Unless)"
        - "Nested object validation"
        - "Collection validation"
        - "Custom validators"
        - "Async validation rules"

      error_handling:
        - "Custom error messages"
        - "Error codes"
        - "Localization support"

    use_cases:
      - "HTTP request validation"
      - "Command validation"
      - "Input sanitization"
      - "Business rule pre-checks"

    when_to_use:
      - "Every FastEndpoints request"
      - "Command objects"
      - "Input that comes from outside system"

    integration_points:
      - "FastEndpoints (Validator<T>)"
      - "MediatR (pipeline behavior)"

    code_example: |
      public sealed class CreateUserRequestValidator
          : Validator<CreateUserRequest>
      {
          public CreateUserRequestValidator()
          {
              RuleFor(x => x.Email)
                  .NotEmpty()
                  .EmailAddress()
                  .WithMessage("Valid email required");

              RuleFor(x => x.WalletAddress)
                  .NotEmpty()
                  .Length(32, 44)
                  .When(x => x.Type == PrincipalType.Human);
          }
      }

# ═══════════════════════════════════════════════════════════
#                    TESTING LIBRARIES
# ═══════════════════════════════════════════════════════════

testing_libraries:
  nunit:
    name: NUnit
    version: "4.x"
    category: testing
    purpose: "Testing framework for unit and integration tests"
    nuget_package: NUnit
    documentation: "Docs/Libraries/NUnit/IMPLEMENTATION_GUIDE.md"

    capabilities:
      test_attributes:
        - "[Test] - Single test method"
        - "[TestCase] - Parameterized tests"
        - "[TestFixture] - Test class"
        - "[SetUp] / [TearDown] - Per-test lifecycle"
        - "[OneTimeSetUp] / [OneTimeTearDown] - Per-fixture lifecycle"

      assertions:
        - "Assert.That() - Classic assertions"
        - "Assert.Multiple() - Multiple assertions"
        - "Assert.Throws<T>() - Exception testing"

      test_organization:
        - "Test fixtures"
        - "Categories"
        - "Explicit tests"
        - "Ignore tests"

    use_cases:
      - "Unit tests (domain logic)"
      - "Integration tests (database)"
      - "API tests (endpoints)"

    when_to_use:
      - "All test projects"
      - "90%+ code coverage target"

    integration_points:
      - "Shouldly (assertions)"
      - "NSubstitute (mocking)"
      - "Testcontainers (integration tests)"

    code_example: |
      [TestFixture]
      public sealed class AxonPrincipalTests
      {
          [Test]
          public void CreateHuman_ShouldReturnHumanPrincipal()
          {
              // Act
              var principal = AxonPrincipal.CreateHuman();

              // Assert
              principal.Type.ShouldBe(PrincipalType.Human);
              principal.Id.Value.ShouldNotBe(Guid.Empty);
          }
      }

  shouldly:
    name: Shouldly
    version: "4.x"
    category: testing
    purpose: "Fluent assertion library with readable error messages"
    nuget_package: Shouldly
    documentation: "Docs/Libraries/Shouldly/IMPLEMENTATION_GUIDE.md"

    capabilities:
      assertions:
        - "value.ShouldBe(expected)"
        - "value.ShouldNotBe(unexpected)"
        - "value.ShouldBeNull() / ShouldNotBeNull()"
        - "collection.ShouldContain(item)"
        - "collection.ShouldBeEmpty()"
        - "value.ShouldBeOfType<T>()"
        - "result.IsSuccess.ShouldBeTrue()"

      advanced:
        - "ShouldSatisfyAllConditions()"
        - "Custom error messages"
        - "Tolerance for numeric comparisons"

    use_cases:
      - "All test assertions"
      - "Readable test output"
      - "Fluent test syntax"

    when_to_use:
      - "Every test assertion (replaces Assert.That)"

    code_example: |
      result.IsSuccess.ShouldBeTrue();
      result.Value.ShouldBe(expected);
      user.Email.ShouldBe("test@example.com");
      list.ShouldContain(item);
      entity.ShouldNotBeNull();

  nsubstitute:
    name: NSubstitute
    version: "5.x"
    category: testing
    purpose: "Mocking framework for unit tests"
    nuget_package: NSubstitute
    documentation: "Docs/Libraries/Moq/IMPLEMENTATION_GUIDE.md"

    capabilities:
      mock_creation:
        - "Substitute.For<IInterface>()"
        - "Partial mocks"
        - "Multiple interfaces"

      setup_behavior:
        - "Returns() - Return values"
        - "ReturnsForAnyArgs() - Ignore arguments"
        - "Throws() - Exception simulation"
        - "DoesNotReturn() - Never returns"

      verification:
        - "Received() - Verify call"
        - "DidNotReceive() - Verify no call"
        - "Received(n) - Verify call count"

    use_cases:
      - "Unit test isolation"
      - "Repository mocking"
      - "Service mocking"
      - "External dependency simulation"

    when_to_use:
      - "Unit tests with dependencies"
      - "Handler testing"
      - "Service layer testing"

    code_example: |
      var mockRepo = Substitute.For<IAxonPrincipalRepository>();
      mockRepo.GetByIdAsync(Arg.Any<AxonUserId>(), Arg.Any<CancellationToken>())
          .Returns(Task.FromResult(testPrincipal));

      // Test
      var result = await handler.Handle(command, CancellationToken.None);

      // Verify
      await mockRepo.Received(1).GetByIdAsync(userId, Arg.Any<CancellationToken>());

  testcontainers:
    name: Testcontainers
    version: "3.x"
    category: testing
    purpose: "Docker containers for integration testing"
    nuget_package: Testcontainers
    documentation: "Integration test infrastructure"

    capabilities:
      container_types:
        - "PostgreSQL container"
        - "Redis container"
        - "Custom containers"

      lifecycle:
        - "StartAsync() - Start container"
        - "StopAsync() - Stop container"
        - "DisposeAsync() - Cleanup"

      configuration:
        - "Port mapping"
        - "Environment variables"
        - "Wait strategies"

    use_cases:
      - "Integration tests with real database"
      - "Cache testing"
      - "Message queue testing"

    when_to_use:
      - "Integration test base classes"
      - "Repository testing"
      - "End-to-end tests"

    code_example: |
      [OneTimeSetUp]
      public async Task OneTimeSetUp()
      {
          _postgres = new PostgreSqlBuilder()
              .WithImage("postgres:16")
              .Build();

          await _postgres.StartAsync();

          var connString = _postgres.GetConnectionString();
          _context = CreateDbContext(connString);
      }

