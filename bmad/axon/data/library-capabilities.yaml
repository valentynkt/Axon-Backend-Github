external_libraries:
  dynamic_auth:
    name: Dynamic.xyz Authentication
    version: "custom"
    category: authentication
    purpose: "Wallet-based JWT authentication via Dynamic.xyz"
    documentation: "Docs/Libraries/dynamic_auth/IMPLEMENTATION_GUIDE.md"

    capabilities:
      jwt_validation:
        - "Bearer token validation"
        - "JWT signature verification"
        - "Claims extraction"
        - "Token expiration check"

      wallet_verification:
        - "Wallet ownership proof"
        - "Signature verification"
        - "Embedded wallet support"

    use_cases:
      - "User authentication"
      - "Wallet ownership verification"
      - "JWT token exchange"

    when_to_use:
      - "All authenticated endpoints"
      - "Identity module operations"

    integration_points:
      - "ASP.NET Core authentication"
      - "JWT Bearer middleware"
      - "Identity module"

    code_example: |
      // Token exchange
      var result = await _dynamicAuth.ValidateJwtAsync(bearerToken, ct);

      // Wallet verification
      var isValid = await _dynamicAuth.VerifyWalletSignatureAsync(
          walletAddress,
          signature,
          message,
          ct);

  helius:
    name: Helius
    version: "custom"
    category: blockchain
    purpose: "Solana RPC and webhook services"
    documentation: "Docs/Libraries/Helius/IMPLEMENTATION_GUIDE.md"

    capabilities:
      rpc_methods:
        - "getTransaction()"
        - "getAccountInfo()"
        - "getBalance()"
        - "getTokenAccounts()"

      webhooks:
        - "Transaction notifications"
        - "Account change notifications"
        - "Token transfer events"

    use_cases:
      - "Wallet verification"
      - "Transaction monitoring"
      - "Token balance queries"

    when_to_use:
      - "Blockchain data needs"
      - "Wallet ownership verification"
      - "Transaction history"

    integration_points:
      - "Identity module (wallet verification)"
      - "HttpClient with Polly"

    code_example: |
      var balance = await _helius.GetBalanceAsync(walletAddress, ct);
      var txn = await _helius.GetTransactionAsync(signature, ct);

  openai:
    name: OpenAI
    version: "custom"
    category: ai
    purpose: "OpenAI API integration for chat functionality"
    documentation: "Docs/Libraries/OpenAI/IMPLEMENTATION_GUIDE.md"

    capabilities:
      chat_completion:
        - "GPT-4 / GPT-3.5 models"
        - "Streaming responses"
        - "Function calling"
        - "Token counting"

      models:
        - "gpt-4-turbo"
        - "gpt-3.5-turbo"
        - "Custom fine-tuned models"

    use_cases:
      - "AI-powered chat responses"
      - "Message generation"
      - "Conversation context"

    when_to_use:
      - "Chat module AI features"
      - "Message processing"

    integration_points:
      - "Chat module"
      - "HttpClient with Polly"
      - "Token budget management"

    code_example: |
      var response = await _openAi.CreateChatCompletionAsync(
          messages: conversationHistory,
          model: "gpt-4-turbo",
          temperature: 0.7,
          ct);

