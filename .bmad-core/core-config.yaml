markdownExploder: true
qa:
  qaLocation: docs/qa
prd:
  prdFile: docs/bmad/prd.md
  prdVersion: v4
  prdSharded: true
  prdShardedLocation: docs/bmad/prd
  epicFilePattern: epic-{n}*.md
architecture:
  architectureFile: docs/bmad/architecture.md
  architectureVersion: v4
  architectureSharded: true
  architectureShardedLocation: docs/bmad/architecture
customTechnicalDocuments: null
devLoadAlwaysFiles:
  - .claude/contexts/dev-essentials.md
  - .claude/contexts/business-context.md
  - .bmad-core/data/technical-preferences.md
devDebugLog: .ai/debug-log.md
devStoryLocation: docs/bmad/stories
slashPrefix: BMad

# Axon-Specific Configuration
axonBackend:
  architecture: "Clean Architecture + CQRS + DDD"
  framework: ".NET 10 preview 5.25277.114"
  patterns:
    cleanArchitecture: true
    cqrsWithMediatR: true
    resultPattern: true
    strongIds: true
    domainDrivenDesign: true
  
  technology:
    webFramework: "FastEndpoints"
    orm: "Entity Framework Core 10.0"
    database: "PostgreSQL"
    validation: "FluentValidation"
    testing: "NUnit + Shouldly + NSubstitute + Testcontainers"
    serialization: "System.Text.Json"
    observability: "OpenTelemetry"
    
  quality:
    testCoverage: ">90% for business logic"
    performanceTarget: "<200ms API response"
    securityStandards: "JWT + RBAC"
    
  domain:
    platform: "Solana Co-Pilot AI"
    approach: "Non-custodial, safety-first"
    businessContext: "Blockchain/Web3 infrastructure"
    
# BMAD Workflow Integration
workflows:
  primary: "brownfield-service"
  documentation: "enhanced-ide-development-workflow" 
  agents:
    orchestrator: "bmad-orchestrator"
    storyManager: "sm (Scrum Master)"
    productManager: "pm (Product Manager)"
    architect: "architect"
    developer: "dev (James)"
    qa: "qa (Quinn - Test Architect)"
    